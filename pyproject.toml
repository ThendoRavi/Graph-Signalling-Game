[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-signalling-game"
version = "0.1.0"
description = "Bandwidth-constrained cooperative multi-agent signalling game (Question 1: K2,2 convention characterisation)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
